<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספריית התנ"ך שלי</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; padding: 20px; }
        h1 { text-align: center; color: #333; }
        
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .book-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .book-card:hover { transform: translateY(-5px); }
        .book-title { font-size: 1.5em; font-weight: bold; color: #2c3e50; margin-bottom: 10px; }
        .book-category { 
            background-color: #e0e7ff; color: #3730a3; 
            padding: 4px 8px; border-radius: 4px; font-size: 0.8em; font-weight: bold;
            display: inline-block; margin-bottom: 10px;
        }
        .book-summary { line-height: 1.6; color: #555; }
    </style>
</head>
<body>

    <h1>📚 ספרי התנ"ך</h1>
    <div id="books-container" class="container">
        <p style="text-align:center; width:100%">טוען נתונים...</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
        apiKey: "AIzaSyDgU8HrSiI2l3WAAoZ1WcB1Rgs4SYEUBBc",
        authDomain: "bdb-bible-ratings.firebaseapp.com",
        projectId: "bdb-bible-ratings",
        storageBucket: "bdb-bible-ratings.firebasestorage.app",
        messagingSenderId: "931047373276",
        appId: "1:931047373276:web:ada62fb6c74101aae3b719",
        measurementId: "G-Y0M5JPE6TY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function loadBooks() {
            const container = document.getElementById('books-container');
            
            try {
                console.log("מתחיל לטעון ספרים...");
                const querySnapshot = await getDocs(collection(db, "books"));
                
                container.innerHTML = ''; // מנקה את הודעת הטעינה

                if (querySnapshot.empty) {
                    console.log("הקולקשיין ריק!");
                    container.innerHTML = '<p>לא נמצאו ספרים במאגר.</p>';
                    return;
                }

                querySnapshot.forEach((doc) => {
                    const book = doc.data();
                    
                    // הדפסה לקונסול כדי שנוכל לראות את שמות השדות
                    console.log("ספר נמצא:", book); 

                    // בדיקה אם קיים שדה summary
                    let summaryText = "אין תקציר";
                    if (book.summary) {
                        summaryText = book.summary;
                    } else if (book.description) {
                        summaryText = book.description;
                    } else {
                        summaryText = "⚠️ השדה 'summary' חסר במסד הנתונים";
                    }

                    const card = document.createElement('div');
                    card.className = 'book-card';
                    card.innerHTML = `
                        <div class="book-title">${book.title}</div>
                        <div class="book-category">${book.category || ''}</div>
                        <div class="book-summary">${summaryText}</div>
                    `;
                    container.appendChild(card);
                });

            } catch (error) {
                console.error("שגיאה בטעינת הנתונים: ", error);
                container.innerHTML = '<p style="color:red">שגיאה בטעינת הנתונים. נא לבדוק את ה-Console (F12).</p>';
            }
        }

        // הפעלת הפונקציה
        loadBooks();
    </script>
</body>
</html>
