<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TanakhDB - הבית</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo-img-wrapper">
    <img src="logo.png" alt="BDB Logo" style="height: 50px; width: auto;">
</a>
        <nav>
            <a href="library.html" style="color:white; text-decoration:none; margin-left:20px; font-weight:bold;">המאגר המלא</a>
            <div id="auth-section">
                <button id="login-btn" class="login-header-btn">התחברות</button>
            </div>
        </nav>
    </header>

    <div class="hero-wrapper">
        <div class="hero-grid">
            <div class="main-stage">
                <img id="stage-img" src="" class="main-image" alt="Featured">
                <button class="slider-btn next-btn" onclick="nextSlide()">&#10094;</button>
                <button class="slider-btn prev-btn" onclick="prevSlide()">&#10095;</button>
                <div class="stage-content">
                    <h1 id="stage-title" class="stage-title">טוען...</h1>
                    <p id="stage-desc" class="stage-desc">אנא המתן...</p>
                    <a href="library.html" style="color: var(--imdb-yellow); text-decoration:none; font-weight:bold;">לפרק המלא ></a>
                </div>
            </div>

            <div class="up-next-container">
                <h3 class="up-next-title">רשימת קריאה</h3>
                <div id="up-next-list"><p style="color:#666;">טוען...</p></div>
            </div>
        </div>
    </div>

    <script type="module">
        // במקום לייבא מפיירבייס, אנחנו מייבאים מהקובץ המקומי שלנו!
        import { db, auth, provider } from './firebase-config.js';
        
        // וכאן אנחנו חייבים לייבא פקודות ספציפיות שלא שמרנו בקונפיג
        import { collection, getDocs, limit, query } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";
        import { signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";

        let books = [];
        let currentIndex = 0;

        // ניהול משתמש
        const authSection = document.getElementById('auth-section');
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authSection.innerHTML = `
                    <div class="user-area">
                        <span style="font-size:0.9rem;">${user.displayName}</span>
                        <img src="${user.photoURL}" class="user-pic">
                        <button id="logout-btn" style="background:none; border:none; color:red; cursor:pointer;">X</button>
                    </div>`;
                document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));
            } else {
                authSection.innerHTML = `<button id="login-btn" class="login-header-btn">התחברות</button>`;
                document.getElementById('login-btn').addEventListener('click', () => signInWithPopup(auth, provider));
            }
        });

        // טעינת נתונים
        async function loadFeatured() {
            try {
                const q = query(collection(db, "books"), limit(5));
                const querySnapshot = await getDocs(q);
                
                books = [];
                querySnapshot.forEach((doc) => books.push(doc.data()));

                if (books.length > 0) {
                    renderSlide(0);
                    renderSideList();
                } else {
                    document.getElementById('stage-title').innerText = "אין ספרים";
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('stage-title').innerText = "שגיאה בטעינה (בדוק את firebase-config.js)";
            }
        }

        // פונקציות גלובליות (חובה להצמיד ל-window כי זה מודול)
        window.renderSlide = (index) => {
            currentIndex = index;
            const book = books[index];
            const randomImg = `https://picsum.photos/seed/${book.title}/1200/800`; 
            document.getElementById('stage-img').src = randomImg;
            document.getElementById('stage-title').innerText = book.title;
            document.getElementById('stage-desc').innerText = book.summary || "תקציר חסר...";
        // במקום סתם library.html
            document.querySelector('.stage-content a').href = `book.html?title=${book.title}`;
        };

        window.nextSlide = () => {
            let next = currentIndex + 1;
            if (next >= books.length) next = 0;
            renderSlide(next);
        };

        window.prevSlide = () => {
            let prev = currentIndex - 1;
            if (prev < 0) prev = books.length - 1;
            renderSlide(prev);
        };

        function renderSideList() {
            const listContainer = document.getElementById('up-next-list');
            listContainer.innerHTML = '';
            books.forEach((book, idx) => {
                const item = document.createElement('div');
                item.className = 'side-item';
                item.onclick = () => renderSlide(idx);
                item.innerHTML = `
                    <img src="https://picsum.photos/seed/${book.title}/100/150" class="side-img">
                    <div class="side-info">
                        <h4>${book.title}</h4>
                        <p>${book.category || 'כללי'}</p>
                    </div>
                `;
                listContainer.appendChild(item);
            });
        }

        loadFeatured();
    </script>
</body>
</html>
