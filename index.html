<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDB - דירוג התנ"ך השיתופי</title>
    <style>
        /* --- Base & Reset --- */
        body { background-color: #000000; color: #ffffff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        button { font-family: 'Segoe UI', sans-serif; }

        /* --- Header --- */
        header {
            background-color: #121212; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 1000; border-bottom: 2px solid #333;
        }
        .logo { font-size: 2rem; font-weight: 900; letter-spacing: 2px; cursor: pointer; }
        .yellow { color: #f5c518; background: rgba(245, 197, 24, 0.1); padding: 0 5px; border-radius: 4px; }
        
        /* אזור משתמש (User Info) */
        .user-area { display: flex; align-items: center; gap: 10px; }
        .login-btn { 
            background: #f5c518; color: black; border: none; padding: 8px 15px; font-weight: bold; cursor: pointer; border-radius: 4px; 
        }
        .login-btn:hover { background: #ffdb58; }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .user-img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid #f5c518; }
        .user-name { font-weight: bold; font-size: 0.9rem; }
        .logout-btn { background: #333; color: white; border: none; padding: 5px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; }

        /* --- Hero --- */
        .hero {
            height: 60vh;
            background: linear-gradient(0deg, #000000 0%, rgba(0,0,0,0.4) 100%), 
                        url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;
            display: flex; flex-direction: column; justify-content: flex-end; padding: 40px; margin-bottom: 30px;
        }
        .hero-content { max-width: 600px; animation: slideUp 1s ease-out; }
        .hero-tag { background: #f5c518; color: black; padding: 5px 10px; font-weight: bold; border-radius: 4px; margin-bottom: 10px; display: inline-block; }
        .hero-title { font-size: 3.5rem; margin: 0; line-height: 1.1; text-shadow: 2px 2px 10px black; }
        .hero-desc { font-size: 1.2rem; margin: 15px 0; color: #ddd; text-shadow: 1px 1px 5px black; }
        .hero-btn { 
            background: #f5c518; color: black; padding: 15px 30px; font-size: 1.2rem; font-weight: bold; border: none; cursor: pointer; border-radius: 5px; margin-top: 10px; transition: 0.2s;
        }
        .hero-btn:hover { background: #ffdb58; transform: scale(1.05); }
        @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* --- Lists --- */
        .section-title { font-size: 1.5rem; border-right: 5px solid #f5c518; padding-right: 15px; margin: 40px 30px 20px; color: #f5c518; font-weight: bold; }
        .scrolling-wrapper { display: flex; overflow-x: auto; padding: 0 30px 40px 30px; gap: 20px; scrollbar-width: thin; scrollbar-color: #333 #000; }
        .scrolling-wrapper::-webkit-scrollbar { height: 8px; }
        .scrolling-wrapper::-webkit-scrollbar-track { background: #000; }
        .scrolling-wrapper::-webkit-scrollbar-thumb { background-color: #333; border-radius: 10px; }

        .poster-card {
            min-width: 150px; width: 150px; background: #1a1a1a; border-radius: 8px; overflow: hidden; position: relative; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .poster-card:hover { transform: scale(1.05); z-index: 10; border: 1px solid #f5c518; }
        .poster-image { height: 220px; background: #222; display: flex; align-items: center; justify-content: center; font-size: 4rem; position: relative; }
        .bg-1 { background: linear-gradient(45deg, #2b5876 0%, #4e4376 100%); }
        .bg-2 { background: linear-gradient(to top, #09203f 0%, #537895 100%); }
        .bg-fire { background: linear-gradient(to top, #ff0844 0%, #ffb199 100%); }
        .poster-rating { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); color: #f5c518; padding: 5px; font-weight: bold; border-radius: 4px; font-size: 0.9rem; }
        .poster-info { padding: 10px; }
        .poster-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .poster-sub { font-size: 0.8rem; color: #aaa; }

        /* --- All Books --- */
        .browse-all-btn {
            display: block; margin: 50px auto; padding: 15px 40px; 
            background: transparent; border: 2px solid #555; color: white; 
            font-size: 1.2rem; cursor: pointer; border-radius: 5px; transition: 0.3s;
        }
        .browse-all-btn:hover { border-color: #f5c518; color: #f5c518; background: rgba(255,255,255,0.05); }

        #all-books-section { display: none; padding: 30px; background: #0a0a0a; border-top: 1px solid #333; }
        .books-category { margin-bottom: 40px; }
        .category-title { color: #f5c518; font-size: 1.4rem; margin-bottom: 15px; border-bottom: 1px solid #333; display: inline-block; padding-bottom: 5px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 15px; }
        
        .book-card { 
            background: #1f1f1f; padding: 15px; text-align: center; border-radius: 8px; cursor: pointer; transition: 0.2s; border: 1px solid transparent; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100px;
        }
        .book-card:hover { background: #2a2a2a; border-color: #f5c518; transform: translateY(-5px); }
        .book-icon { font-size: 2rem; margin-bottom: 10px; }
        .book-name { font-weight: bold; }
        .book-chapters { font-size: 0.8rem; color: #888; margin-top: 5px; }

        /* --- Overlays & Modals --- */
        #chapter-view-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1500; display: none;
            overflow-y: auto; padding: 40px 20px;
        }
        .chapter-header { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto 40px auto; border-bottom: 2px solid #333; padding-bottom: 20px; }
        .back-btn { background: none; border: 1px solid #555; color: white; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-size: 1rem; }
        .back-btn:hover { border-color: #f5c518; color: #f5c518; }
        .chapters-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 15px; max-width: 1000px; margin: 0 auto; }
        .chapter-btn {
            background: #1a1a1a; border: 1px solid #333; color: white; padding: 20px 0; 
            font-size: 1.2rem; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s;
        }
        .chapter-btn:hover { background: #f5c518; color: black; border-color: #f5c518; transform: scale(1.1); }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: none;
            justify-content: center; align-items: center; z-index: 2000; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #1f1f1f; padding: 30px; border-radius: 15px; text-align: center;
            width: 90%; max-width: 500px; border: 1px solid #333; position: relative;
            box-shadow: 0 0 30px rgba(245, 197, 24, 0.2);
        }
        .close-modal { position: absolute; top: 15px; left: 15px; color: #aaa; cursor: pointer; font-size: 1.5rem; }
        .rating-options { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
        .rate-circle {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .rate-circle:hover { border-color: #f5c518; color: #f5c518; transform: scale(1.1); }
        .rate-circle.selected { background-color: #f5c518; color: black; border-color: #f5c518; }
        .submit-btn {
            background: #f5c518; color: black; border: none; padding: 10px 30px;
            font-weight: bold; font-size: 1.1rem; border-radius: 5px; margin-top: 25px; cursor: pointer; width: 100%;
        }
        .submit-btn:disabled { background: #555; cursor: not-allowed; }
        
        .live-score { font-size: 0.9rem; color: #f5c518; margin-top: 10px; font-weight: bold; }

    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="window.scrollTo(0,0)">B<span class="yellow">D</span>B</div>
        
        <div class="user-area">
            <button id="login-btn" class="login-btn">G התחבר עם גוגל</button>
            
            <div id="user-info" class="user-profile" style="display: none;">
                <img id="user-img" src="" class="user-img">
                <span id="user-name" class="user-name"></span>
                <button id="logout-btn" class="logout-btn">יציאה</button>
            </div>
        </div>
    </header>

    <div id="main-content">
        <div class="hero">
            <div class="hero-content">
                <span class="hero-tag">הכי פופולרי</span>
                <h1 class="hero-title">בראשית פרק א'</h1>
                <p class="hero-desc">ההתחלה של הכל. בריאת העולם בשישה ימים.</p>
                <button class="hero-btn" onclick="openRatingModal('בראשית', 1)">
                    ⭐ דרג את הפרק <span id="hero-rating-text">(טוען...)</span>
                </button>
            </div>
        </div>

        <div class="section-title">דירוגים נבחרים ></div>
        <div class="scrolling-wrapper" id="top-rated-list"></div>

        <button class="browse-all-btn" onclick="toggleAllBooks()">📚 צפייה ודירוג כל הספרים</button>

        <div id="all-books-section"></div>
    </div>

    <div id="chapter-view-overlay">
        <div class="chapter-header">
            <h1 id="chapter-view-title" style="margin:0">ספר בראשית</h1>
            <button class="back-btn" onclick="closeChapterView()">✖ סגירה</button>
        </div>
        <div id="chapters-container" class="chapters-grid"></div>
    </div>

    <div id="rating-modal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal()">✕</span>
            <h2 id="modal-title">דרג...</h2>
            
            <div id="modal-live-stats" class="live-score">טוען נתונים...</div>
            
            <div class="rating-options" id="rating-options"></div>
            <button id="submit-rating-btn" class="submit-btn" disabled>שלח דירוג</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyDgU8HrSiI2l3WAAoZ1WcB1Rgs4SYEUBBc",
            authDomain: "bdb-bible-ratings.firebaseapp.com",
            projectId: "bdb-bible-ratings",
            storageBucket: "bdb-bible-ratings.firebasestorage.app",
            messagingSenderId: "931047373276",
            appId: "1:931047373276:web:ada62fb6c74101aae3b719",
            measurementId: "G-Y0M5JPE6TY"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null; // ישמור את המשתמש המחובר

        // --- Auth Logic ---
        
        // כפתור התחברות
        document.getElementById('login-btn').onclick = () => {
            signInWithPopup(auth, provider)
                .then((result) => {
                    console.log("User logged in:", result.user);
                }).catch((error) => {
                    console.error("Login failed:", error);
                    alert("התחברות נכשלה: " + error.message);
                });
        };

        // כפתור יציאה
        document.getElementById('logout-btn').onclick = () => {
            signOut(auth).then(() => {
                alert("התנתקת בהצלחה");
            });
        };

        // האזנה לשינויים במצב התחברות (פועל אוטומטית כשהדף עולה)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // משתמש מחובר
                currentUser = user;
                document.getElementById('login-btn').style.display = 'none';
                document.getElementById('user-info').style.display = 'flex';
                document.getElementById('user-name').innerText = user.displayName.split(' ')[0]; // רק שם פרטי
                document.getElementById('user-img').src = user.photoURL;
            } else {
                // אורח
                currentUser = null;
                document.getElementById('login-btn').style.display = 'block';
                document.getElementById('user-info').style.display = 'none';
            }
        });


        // --- Data: Full Tanakh ---
        const tanakhData = [
          { category: "תורה", books: [{ name: "בראשית", icon: "🌍", chapters: 50 }, { name: "שמות", icon: "🌊", chapters: 40 }, { name: "ויקרא", icon: "🔥", chapters: 27 }, { name: "במדבר", icon: "⛺", chapters: 36 }, { name: "דברים", icon: "📜", chapters: 34 }] },
          { category: "נביאים", books: [{ name: "יהושע", icon: "⚔️", chapters: 24 }, { name: "שופטים", icon: "⚖️", chapters: 21 }, { name: "שמואל א", icon: "👑", chapters: 31 }, { name: "שמואל ב", icon: "👑", chapters: 24 }, { name: "מלכים א", icon: "🏰", chapters: 22 }, { name: "מלכים ב", icon: "🏰", chapters: 25 }, { name: "ישעיהו", icon: "🦅", chapters: 66 }, { name: "ירמיהו", icon: "⛓️", chapters: 52 }, { name: "יחזקאל", icon: "🎡", chapters: 48 }, { name: "תרי עשר", icon: "📜", chapters: 67 }] },
          { category: "כתובים", books: [{ name: "תהילים", icon: "🎵", chapters: 150 }, { name: "משלי", icon: "🧠", chapters: 31 }, { name: "איוב", icon: "🤕", chapters: 42 }, { name: "שיר השירים", icon: "❤️", chapters: 8 }, { name: "רות", icon: "🌾", chapters: 4 }, { name: "איכה", icon: "😢", chapters: 5 }, { name: "קהלת", icon: "☀️", chapters: 12 }, { name: "אסתר", icon: "🎭", chapters: 10 }, { name: "דניאל", icon: "🦁", chapters: 12 }, { name: "עזרא ונחמיה", icon: "🧱", chapters: 23 }, { name: "דברי הימים א", icon: "📚", chapters: 29 }, { name: "דברי הימים ב", icon: "📚", chapters: 36 }] }
        ];

        // --- Render Main Page ---
        // הצגה ראשונית של ציון לבראשית פרק 1
        updateAverageDisplay('בראשית', 1, 'hero-rating-text');

        // רשימה לדוגמה
        const topRated = [{ title: "קריעת ים סוף", book: "שמות", chapter: 14, rating: "9.9", icon: "🌊", bg: "bg-1" }, { title: "דוד וגוליית", book: "שמואל א", chapter: 17, rating: "9.8", icon: "⚔️", bg: "bg-fire" }];
        
        function renderList(containerId, data) {
            const container = document.getElementById(containerId);
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'poster-card';
                card.innerHTML = `<div class="poster-image ${item.bg}">${item.icon}<div class="poster-rating">★ ${item.rating}</div></div><div class="poster-info"><div class="poster-title">${item.title}</div><div class="poster-sub">${item.book} פ' ${item.chapter}</div></div>`;
                card.onclick = () => openRatingModal(item.book, item.chapter);
                container.appendChild(card);
            });
        }
        renderList('top-rated-list', topRated);

        // --- Render All Books ---
        const allBooksSection = document.getElementById('all-books-section');
        tanakhData.forEach(section => {
            const div = document.createElement('div');
            div.className = 'books-category';
            div.innerHTML = `<div class="category-title">${section.category}</div>`;
            const grid = document.createElement('div');
            grid.className = 'grid';
            section.books.forEach(book => {
                const bookCard = document.createElement('div');
                bookCard.className = 'book-card';
                bookCard.innerHTML = `<div class="book-icon">${book.icon}</div><div class="book-name">${book.name}</div><div class="book-chapters">${book.chapters} פרקים</div>`;
                bookCard.onclick = () => openBookChapters(book);
                grid.appendChild(bookCard);
            });
            div.appendChild(grid);
            allBooksSection.appendChild(div);
        });

        // --- UI Logic ---
        window.toggleAllBooks = () => {
            const section = document.getElementById('all-books-section');
            section.style.display = section.style.display === 'block' ? 'none' : 'block';
            if(section.style.display === 'block') section.scrollIntoView({ behavior: 'smooth' });
        };

        window.openBookChapters = (book) => {
            document.getElementById('chapter-view-title').innerText = `ספר ${book.name}`;
            const container = document.getElementById('chapters-container');
            container.innerHTML = ''; 
            for (let i = 1; i <= book.chapters; i++) {
                const btn = document.createElement('button');
                btn.className = 'chapter-btn';
                btn.innerText = i;
                btn.onclick = () => openRatingModal(book.name, i);
                container.appendChild(btn);
            }
            document.getElementById('chapter-view-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        };

        window.closeChapterView = () => {
            document.getElementById('chapter-view-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        };

        // --- Rating Logic (With Real Data) ---
        let currentSelection = 0;
        let currentBook = "";
        let currentChapter = 0;

        // יצירת הכפתורים בחלון
        const ratingOptionsContainer = document.getElementById('rating-options');
        for (let i = 1; i <= 10; i++) {
            const circle = document.createElement('div');
            circle.className = 'rate-circle';
            circle.innerText = i;
            circle.onclick = () => selectRating(i, circle);
            ratingOptionsContainer.appendChild(circle);
        }

        function selectRating(num, element) {
            currentSelection = num;
            document.querySelectorAll('.rate-circle').forEach(el => el.classList.remove('selected'));
            element.classList.add('selected');
            const btn = document.getElementById('submit-rating-btn');
            btn.disabled = false;
            btn.innerText = `שלח דירוג (${num})`;
        }

        // פתיחת המודל וטעינת נתונים אמיתיים!
        window.openRatingModal = async (book, chapter) => {
            currentBook = book;
            currentChapter = chapter;
            
            document.getElementById('modal-title').innerText = `דירוג: ${book} פרק ${chapter}`;
            document.getElementById('rating-modal').style.display = 'flex';
            document.getElementById('modal-live-stats').innerText = "טוען נתונים...";

            // קריאה לפיירבייס לחשב ממוצע
            updateAverageDisplay(book, chapter, 'modal-live-stats');
        };

        // פונקציה שמחשבת ממוצע מאוסף הדירוגים
        async function updateAverageDisplay(book, chapter, elementId) {
            const el = document.getElementById(elementId);
            try {
                // שאילתה: תביא את כל הדירוגים של הספר והפרק הזה
                const q = query(collection(db, "ratings"), where("book", "==", book), where("chapter", "==", chapter));
                const querySnapshot = await getDocs(q);
                
                let sum = 0;
                let count = 0;
                
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    if(data.score) {
                        sum += data.score;
                        count++;
                    }
                });

                if (count > 0) {
                    const avg = (sum / count).toFixed(1); // דיוק של ספרה אחת
                    el.innerText = `ציון ממוצע: ${avg} ⭐ (${count} הצבעות)`;
                    // עדכון כפתור הירו אם רלוונטי
                    if (elementId === 'hero-rating-text') el.innerText = avg;
                } else {
                    el.innerText = "אין עדיין דירוגים. היה הראשון!";
                    if (elementId === 'hero-rating-text') el.innerText = "חדש";
                }

            } catch (e) {
                console.error("Error fetching ratings:", e);
                el.innerText = "שגיאה בטעינת נתונים";
            }
        }

        window.closeModal = () => {
            document.getElementById('rating-modal').style.display = 'none';
            currentSelection = 0;
            document.querySelectorAll('.rate-circle').forEach(el => el.classList.remove('selected'));
            document.getElementById('submit-rating-btn').disabled = true;
            document.getElementById('submit-rating-btn').innerText = "שלח דירוג";
        };

        // שליחת דירוג
        document.getElementById('submit-rating-btn').onclick = async () => {
            if (!currentUser) {
                alert("עליך להתחבר עם גוגל כדי להצביע!");
                return;
            }

            const btn = document.getElementById('submit-rating-btn');
            btn.innerText = "שולח...";
            try {
                // שמירת המסמך עם המזהה של המשתמש
                await addDoc(collection(db, "ratings"), {
                    book: currentBook,
                    chapter: currentChapter,
                    score: currentSelection,
                    timestamp: new Date(),
                    userId: currentUser.uid,       // מזהה ייחודי
                    userName: currentUser.displayName // שם המצביע
                });
                
                alert("הדירוג התקבל! ⭐");
                closeModal();
                // רענון הציון בדף הראשי אם זה אותו פרק
                if (currentBook === 'בראשית' && currentChapter === 1) {
                    updateAverageDisplay('בראשית', 1, 'hero-rating-text');
                }

            } catch (e) {
                console.error(e);
                alert("שגיאה בשליחה: " + e.message);
            }
        };

        window.onclick = function(event) {
            if (event.target == document.getElementById('rating-modal')) closeModal();
        }

    </script>
</body>
</html>
